name: Kintemp
options:
  bundleIdPrefix: dev.willsawyerrrr
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
targets:
  Kintemp:
    type: application
    platform: iOS
    sources: [App, Core]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kintemp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Kintemp reads measurements from your ThermoCare thermometer over Bluetooth.
        UIBackgroundModes: [bluetooth-central, remote-notification]
        NSHealthUpdateUsageDescription: Kintemp saves your thermometer readings to Apple Health as body temperature.
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
    entitlements:
      path: App/Kintemp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.icloud-container-identifiers:
          [iCloud.dev.willsawyerrrr.kintemp]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.willsawyerrrr.kintemp
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  KintempTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Kintemp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.willsawyerrrr.kintemp.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kintemp:
    build:
      targets:
        Kintemp: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [KintempTests]
