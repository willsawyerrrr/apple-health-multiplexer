name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1

  ios:
    runs-on: macos-26
    env:
      DEVELOPMENT_TEAM: ""
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Select simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | contains("iOS"))
             | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes available -j | jq -c '
              [.runtimes[] | select(.platform == "iOS")][-1] // empty')
            if [ -z "$runtime" ]; then
              echo "::error::No iOS simulator runtime is installed"
              exit 1
            fi
            devicetype=$(jq -r '
              [.supportedDeviceTypes[] | select(.name | startswith("iPhone"))][-1].identifier' <<< "$runtime")
            udid=$(xcrun simctl create Kintemp-CI "$devicetype" "$(jq -r .identifier <<< "$runtime")")
          fi
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Test
        run: >
          xcodebuild test
          -scheme Kintemp
          -destination "id=$SIMULATOR_UDID"
          CODE_SIGNING_ALLOWED=NO

  ci-status:
    name: CI Status
    if: always()
    needs: [pre-commit, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
